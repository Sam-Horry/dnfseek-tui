[project]
name = "dnfseek"
version = "0.1.4"
description = "A TUI package browser for Fedora, built with Textual"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.14.5",
    "textual>=8.2.8",
]

[project.scripts]
dnfseek = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "main.tcss",
]
